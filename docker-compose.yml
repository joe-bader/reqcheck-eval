services:
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  n8n:
    image: docker.n8n.io/n8nio/n8n
    profiles: [n8n]
    network_mode: host  # reaches Ollama and Qdrant on localhost
    environment:
      N8N_DIAGNOSTICS_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro

volumes:
  qdrant_data:
  n8n_data:
