<title id="title">Local model results: dev and sealed-test F1, with runtime</title>
<desc id="desc">gemma4:e4b: dev F1 0.60, test F1 0.78, 0.7 seconds per requirement; qwen3.6:35b-a3b (largest): dev F1 0.77, test F1 0.73, 5.9 seconds per requirement; granite4.2:8b: dev F1 0.44, test F1 0.59, 5.1 seconds per requirement; Kev-9B (System 1, see below): dev F1 0.54, test F1 0.49, 0.15 seconds per requirement; qwen3:8b: dev F1 0.55, test F1 0.39, 1.3 seconds per requirement; An agent that flags everything: dev F1 0.35, test F1 0.32, runtime not reported. Thirty synthetic requirements per set; small score differences are inconclusive. Kev-9B returns probabilities only.</desc>
<metadata>Source: README.md, Does it work? exact-value table; supporting experiment records: results/LOG.md. Regenerate with docs/charts/generate_results.py. F1 is a score on a 0–1 scale, not a percent accuracy. Time values are the README dev-run summary; no confidence intervals are supplied.</metadata>
